['검정 옷을 입으면 어떤 느낌인가요?',['얼굴이 또렷하고 선명해져요','검정이 강해서 얼굴이 가려져요','크게 차이가 없어요','잘 모르겠어요']],
['명도는 어느 쪽이 더 잘 어울리나요?',['밝은 파스텔·라이트 톤','중간 밝기의 차분한 톤','어두운 딥 톤','잘 모르겠어요']],
['채도는 어느 쪽이 더 잘 어울리나요?',['맑고 쨍한 색','회색이 섞인 부드러운 색','둘 다 비슷해요','잘 모르겠어요']],
['피부에 가까이 대었을 때 더 조화로운 브라운은?',['카멜·골든 브라운','코코아·애쉬 브라운','차이를 모르겠어요']]
];
function scoreAnswers(qs,answers,weights){const scores={};Object.keys(weights).forEach(k=>scores[k]=0);let valid=0;qs.forEach((q,i)=>{const a=answers[i];if(a===undefined||a===q[1].length-1&&q[1][a].includes('모르겠'))return;valid++;Object.entries(weights).forEach(([key,m])=>{scores[key]+=m[i]?.[a]||0})});return{scores,valid}}
function faceResult(){const weights={
'계란형':[[0,1,0],[0,2,0],[0,0,1],[2,0,0],[2,0,0],[1,0,0],[1,0,0,0]],
'둥근형':[[0,0,3],[0,1,0],[0,0,1],[3,0,0],[3,0,0],[3,0,0],[3,0,0,0]],
'긴형':[[3,2,0],[0,2,0],[0,2,0],[1,1,0],[1,1,0],[0,2,0],[0,3,0,0]],
'각진형':[[1,1,0],[0,1,2],[0,2,0],[0,4,0],[0,4,0],[0,3,0],[0,0,4,0]],
'하트형':[[0,1,1],[4,0,0],[0,0,1],[0,0,3],[0,0,4],[0,0,3],[0,0,0,3]],
'다이아몬드형':[[0,1,1],[0,0,0],[4,0,0],[0,0,2],[0,0,3],[0,0,3],[0,0,0,3]]};
const {scores,valid}=scoreAnswers(faceQs,faceAnswers,weights);const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const title=valid<4?'추가 관찰이 필요한 얼굴형':ranked[0][0];const tips={'계란형':['다양한 헤어 길이를 비교해 보세요.','안경은 얼굴 너비에 맞는 크기부터 확인해 보세요.'],'둥근형':['정수리 볼륨과 세로 방향 레이어를 비교해 보세요.','블러셔를 사선으로 배치해 인상 변화를 확인해 보세요.'],'긴형':['옆 볼륨이 있는 헤어와 앞머리를 비교해 보세요.','가로 방향 블러셔와 깊이 있는 안경테를 시도해 보세요.'],'각진형':['부드러운 곡선의 레이어와 웨이브를 비교해 보세요.','곡선형 프레임과 직선형 프레임을 번갈아 착용해 보세요.'],'하트형':['턱 주변에 볼륨이 오는 스타일을 비교해 보세요.','하단이 부드러운 안경테를 시도해 보세요.'],'다이아몬드형':['이마와 턱 주변의 볼륨 균형을 살펴보세요.','광대 부근의 헤어 볼륨을 조절해 보세요.']};return{title,description:valid<4?'확실한 답변이 적어 유형을 단정하기 어렵습니다. 정면 사진이나 거울로 비율을 다시 확인해 주세요.':`응답 ${valid}/7개를 기반으로 한 스타일링 참고 결과입니다. 2순위 유형은 ${ranked[1][0]}이며, 얼굴형은 복합적으로 나타날 수 있습니다.`,tips:tips[title]||['자연광에서 정면 비율을 다시 확인해 보세요.','모호한 항목을 다시 선택해 주세요.'],confidence:valid>=6&&ranked[0][1]-ranked[1][1]>=4?'상대적으로 뚜렷한 응답':'복합형 가능성 있음'}}
function colorResult(){const weights={'봄 웜':[[2,0,0],[3,0,0],[2,0,0],[3,0,0],[3,0,0],[0,1,0],[3,0,0],[3,0,0],[2,0,0]],'여름 쿨':[[0,2,0],[0,3,0],[0,2,0],[0,3,0],[0,3,0],[0,2,0],[3,0,0],[0,3,0],[0,2,0]],'가을 웜':[[2,0,0],[2,0,0],[2,0,0],[2,0,0],[0,3,1],[0,1,0],[0,2,3],[0,3,0],[3,0,0]],'겨울 쿨':[[0,2,0],[0,3,0],[0,3,0],[0,3,0],[1,0,3],[3,0,0],[0,0,3],[3,0,0],[0,3,0]]};const {scores,valid}=scoreAnswers(colorQs,colorAnswers,weights);const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const title=valid<5?'추가 비교가 필요한 컬러 타입':ranked[0][0];const tips={'봄 웜':['피치·코랄·라이트 베이지를 얼굴 옆에서 비교해 보세요.','맑은 웜톤 립과 블러셔를 먼저 테스트해 보세요.'],'여름 쿨':['로즈·모브·라벤더·소프트 그레이를 비교해 보세요.','차분한 쿨핑크 계열을 테스트해 보세요.'],'가을 웜':['카멜·테라코타·올리브·웜 브라운을 비교해 보세요.','채도를 낮춘 브릭 계열 립을 테스트해 보세요.'],'겨울 쿨':['퓨어 화이트·블랙·체리 레드·쿨 핑크를 비교해 보세요.','선명한 대비가 얼굴에 미치는 영향을 확인해 보세요.']};return{title,description:valid<5?'비교 가능한 답변이 부족합니다. 자연광에서 색 천이나 의류를 얼굴 가까이에 대고 다시 확인해 주세요.':`응답 ${valid}/9개에 기반한 4계절 참고 결과입니다. 2순위는 ${ranked[1][0]}입니다. 자가 응답만으로 12·16타입을 확정할 수는 없습니다.`,tips:tips[title]||['자연광에서 두 색을 나란히 비교해 보세요.','잘 모르겠는 항목을 다시 확인해 보세요.'],confidence:valid>=8&&ranked[0][1]-ranked[1][1]>=5?'상대적으로 뚜렷한 응답':'경계형 또는 복합 가능성 있음'}}
function renderAnalyze(){if(sub==='face'||sub==='color'){const face=sub==='face',qs=face?faceQs:colorQs,answers=face?faceAnswers:colorAnswers;if(step>=qs.length){const r=face?faceResult():colorResult();shell(`<div class="eyebrow">${face?'FACE ANALYSIS':'COLOR ANALYSIS'}</div><div class="result"><div class="eyebrow">나의 분석 결과 · ${esc(r.confidence)}</div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p></div>${section('추천 스타일링')}${r.tips.map((x,i)=>`<div class="card advice"><span class="advice-num">0${i+1}</span><span>${esc(x)}</span></div>`).join('')}<div class="notice">이 결과는 자가 응답을 기반으로 한 스타일 참고 자료이며, 사진·색채 측정이나 전문가의 대면 진단을 대신하지 않습니다.</div><div class="spacer"></div>${btn('결과 저장',`saveAnalysis('${sub}')`,'primary full')}<div class="spacer"></div>${btn('다시 분석하기',`restartAnalysis('${sub}')`,'outline full')}`);return}const q=qs[step];shell(`<div class="row"><span class="eyebrow">${face?'FACE SHAPE':'PERSONAL COLOR'}</span><span class="muted">${step+1} / ${qs.length}</span></div><div class="progress" style="margin:16px 0 30px"><div style="width:${(step+1)/qs.length*100}%"></div></div><h1 class="analysis-question">${q[0]}</h1><p class="muted">가장 가까운 답변을 선택해 주세요. 모르는 항목은 건너뛰어도 됩니다.</p><div class="answer-list">${q[1].map((a,i)=>`<button class="answer-option" onclick="answerAnalysis(${i})"><span>${esc(a)}</span><span>›</span></button>`).join('')}</div>${step?btn('← 이전 질문','step--;render()','outline'):''}`);return}shell(`${section('나를 알아가는 뷰티 분석')}<p class="muted">한 번의 질문으로 단정하지 않고, 여러 특징을 종합해 스타일링 방향을 제안합니다.</p><div class="analysis-entry" onclick="restartAnalysis('face')"><div class="analysis-index">01 / FACE</div><h3>얼굴형 세부 분석</h3><p>길이·너비·광대·턱선 등 7가지 특징을 종합해 유형과 복합 가능성을 살펴봅니다.</p><span class="entry-link">7문항 분석 시작 ↗</span></div><div class="analysis-entry" onclick="restartAnalysis('color')"><div class="analysis-index">02 / COLOR</div><h3>퍼스널컬러 탐색</h3><p>웜·쿨, 밝기, 선명도, 대비 등 9가지 비교로 4계절 방향을 탐색합니다.</p><span class="entry-link">9문항 분석 시작 ↗</span></div>${state.face||state.color?section('저장된 분석 결과'):''}${state.face?`<div class="card">얼굴형 <b>${esc(state.face.title)}</b></div>`:''}${state.color?`<div class="card">퍼스널컬러 <b>${esc(state.color.title)}</b></div>`:''}`)}
function restartAnalysis(s){step=0;if(s==='face')faceAnswers={};else colorAnswers={};go('analyze',s)}
function answerAnalysis(i){(sub==='face'?faceAnswers:colorAnswers)[step]=i;step++;render()}
function saveAnalysis(s){state[s]=s==='face'?faceResult():colorResult();save();go('analyze')}
function renderLab(){shell(`${section('Beauty Lab')}<p class="muted">Practical styling guides to explore at your own pace.</p>${[{t:'Blush placement',icon:'🌸',desc:'Center of cheeks for a soft look; lifted placement for a different effect.'},{t:'Hair volume & balance',icon:'✂️',desc:'Side layers, fringe and parting can change the visual balance of a hairstyle.'},{t:'Color pairing',icon:'🎨',desc:'Try one statement shade with two softer neutrals.'},{t:'Gentle skincare basics',icon:'🧴',desc:'Cleanse gently, moisturize as needed, and use broad-spectrum sunscreen.'},{t:'New product journal',icon:'📔',desc:'Introduce products gradually and note your experience rather than assuming cause and effect.'}].map(x=>`<div class="card"><div style="font-size:28px">${x.icon}</div><h3>${x.t}</h3><p class="muted">${x.desc}</p></div>`).join('')}<div class="notice">Educational beauty content only. Persistent irritation or a concerning skin change deserves professional advice.</div>`)}
function renderMe(){if(sub==='shelf'){shell(`<div class="row">${section('My Shelf')}${btn('← Back',"go('me')",'outline')}</div><p class="muted">Keep track of what you own. Everything is stored in this browser on this device.</p><div class="card"><div class="field"><label>Product name</label><input id="productName" placeholder="e.g. Gentle Hydrating Cleanser" maxlength="90"></div><div class="field"><label>Category</label><select id="productCat"><option>Cleanser</option><option>Toner</option><option>Serum</option><option>Moisturizer</option><option>Sunscreen</option><option>Other</option></select></div>${btn('Add product','addProduct()','primary full')}</div>${state.products.length?state.products.map((p,i)=>`<div class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="tiny">${esc(p.cat)}</div></div>${btn('Remove',`removeProduct(${i})`,'outline')}</div><div class="choices" style="margin-top:12px">${btn('Add to AM',`addRoutine(${i},'am')`,'secondary')}${btn('Add to PM',`addRoutine(${i},'pm')`,'secondary')}</div></div>`).join(''):`<div class="empty">No products yet. Add your first product above.</div>`}`);return}if(sub==='diary'){shell(`${section('Skin Diary')}<p class="muted">A personal reflection journal, not a clinical assessment.</p><div class="card"><div class="field"><label>How comfortable does your skin feel today?</label><select id="comfort"><option value="5">5 — Very comfortable</option><option value="4">4 — Comfortable</option><option value="3">3 — Neutral</option><option value="2">2 — Some discomfort</option><option value="1">1 — Uncomfortable</option></select></div><div class="field"><label>Notes (optional)</label><textarea id="diaryNotes" maxlength="600" placeholder="What did you notice today?"></textarea></div>${btn('Save entry','addDiary()','primary full')}</div>${state.diary.slice().reverse().map(d=>`<div class="card"><div class="row"><b>${esc(d.date)}</b><span class="pill">Comfort ${d.comfort}/5</span></div><p class="muted">${esc(d.notes)}</p></div>`).join('')}`);return}shell(`${section('My Beauty')}${authPanel()}<div class="card"><div class="eyebrow">Your profile</div><div class="field"><label>Skin type (self-reported)</label><select id="skinType" onchange="state.skin=this.value;save()">${['Dry','Oily','Combination','Normal','Not sure'].map(x=>`<option ${state.skin===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Main skincare goal</label><select id="skinConcern" onchange="state.concern=this.value;save()">${['Hydration','Simple routine','Oil balance','Skin comfort','Texture'].map(x=>`<option ${state.concern===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card tile" onclick="go('me','shelf')"><span class="emoji">🧴</span><div><h3>My Shelf</h3><p>${state.products.length} saved products · AM ${state.am.length} · PM ${state.pm.length}</p></div></div><div class="card tile" onclick="go('me','diary')"><span class="emoji">📔</span><div><h3>Skin Diary</h3><p>${state.diary.length} entries saved</p></div></div><div class="card"><b>Privacy & data</b><p class="muted">Signed-in data is stored privately in Supabase. Signed-out data stays in this browser. Community posts remain local drafts, not public. Export a backup before switching devices.</p>${btn('Export my data','exportData()','outline full')}<div class="spacer"></div>${btn('Import my data','document.getElementById(&quot;importFile&quot;).click()','outline full')}<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"><div class="spacer"></div>${btn('Delete all my data','deleteData()','outline full')}</div>`)}function addProduct(){let name=document.getElementById('productName').value.trim(),cat=document.getElementById('productCat').value;if(!name)return alert('Enter a product name.');if(state.products.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return alert('This product is already in your shelf.');state.products.push({name,cat,id:Date.now()});save();render()}function removeProduct(i){let p=state.products[i];if(!confirm('Remove this product?'))return;state.products.splice(i,1);state.am=state.am.filter(x=>x!==p.name);state.pm=state.pm.filter(x=>x!==p.name);save();render()}function addRoutine(i,period){let name=state.products[i].name;if(!state[period].includes(name))state[period].push(name);save();alert('Added to '+period.toUpperCase()+' routine.');render()}function addDiary(){const entry={date:today(),comfort:Number(document.getElementById('comfort').value),notes:document.getElementById('diaryNotes').value.trim()};state.diary=state.diary.filter(d=>d.date!==entry.date);state.diary.push(entry);save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='glowme-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{if(file.size>1048576)throw Error("File exceeds 1 MB");const raw=JSON.parse(await file.text());if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Invalid format");for(const key of ["products","am","pm","diary","posts","likes"]){if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw Error("Invalid "+key)}if(!confirm("Replace all local GLOWME data with this backup?"))return;state={...structuredClone(init),...Object.fromEntries(Object.keys(init).filter(k=>Object.hasOwn(raw,k)).map(k=>[k,raw[k]]))};save();go("today");alert("Backup imported successfully.")}catch(e){alert("Could not import backup: "+e.message)}}function deleteData(){if(confirm('Permanently delete all data stored by GLOWME on this browser?')){localStorage.removeItem(KEY);state=structuredClone(init);go('today')}}
const seed=[{id:'s1',tag:'Skincare',title:'What is your favorite simple AM routine?',body:'Share the three steps you actually enjoy keeping up with.',author:'GLOWME Team'},{id:'s2',tag:'Personal Color',title:'Which lipstick shades do you reach for most?',body:'Coral, rose, berry or something else? Tell us your favorites.',author:'GLOWME Team'},{id:'s3',tag:'Face Styling',title:'What hairstyle would you like to try next?',body:'Short bob, long layers or curtain bangs? Inspiration is welcome.',author:'GLOWME Team'}];function renderCommunity(){let posts=[...state.posts,...seed].filter(p=>communityFilter==='All'||p.tag===communityFilter);shell(`${section('Beauty Community')}<p class="muted">A local preview of the future GLOWME community. Your posts are not public or shared with other people.</p><div class="choices">${['All','Skincare','Personal Color','Face Styling','Makeup'].map(x=>`<button class="choice ${communityFilter===x?'active':''}" onclick="communityFilter='${x}';render()">${x}</button>`).join('')}</div><div class="card"><b>Share a beauty thought</b><div class="field"><label>Category</label><select id="postTag">${['Skincare','Personal Color','Face Styling','Makeup'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="postTitle" maxlength="100" placeholder="What would you like to discuss?"></div><div class="field"><label>Post</label><textarea id="postBody" maxlength="1000" placeholder="Share a tip or ask a question..."></textarea></div>${btn('Save draft on this device','addPost()','primary full')}</div>${posts.map(p=>`<div class="card post"><div class="row"><span class="pill">${esc(p.tag)}</span><span class="tiny">${esc(p.author)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="row"><button class="outline" onclick="toggleLike('${p.id}')">${state.likes.includes(p.id)?'♥ Liked':'♡ Like'}</button>${p.author==='You'?btn('Delete',`removePost('${p.id}')`,'outline'):''}</div></div>`).join('')}`)}function addPost(){let title=document.getElementById('postTitle').value.trim(),body=document.getElementById('postBody').value.trim(),tag=document.getElementById('postTag').value;if(!title||!body)return alert('Add a title and a post.');state.posts.unshift({id:'p'+Date.now(),tag,title,body,author:'You'});save();render()}function toggleLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}function removePost(id){state.posts=state.posts.filter(x=>x.id!==id);save();render()}render();applyLanguage();initAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
