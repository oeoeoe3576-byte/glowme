function renderLab(){if(sub.startsWith('guide-')){const i=Number(sub.slice(6)),g=labGuides[i];if(!g){go('lab');return}shell(`${btn('← 매거진 목록',"go('lab')",'outline')}<article class="mag-article"><div class="mag-hero" style="--mag-accent:${g.accent}"><span class="eyebrow">GLOWME EDITORIAL / 0${i+1}</span><h1>${g.title}</h1><p>${g.summary}</p><div class="mag-object"></div></div><div class="mag-intro">일상에서 직접 비교하고 활용할 수 있는 뷰티 가이드를 소개합니다.</div>${g.details.map((d,j)=>`<section class="mag-section"><div class="eyebrow">CHAPTER 0${j+1}</div><h2>${['핵심 포인트','스타일링 방법','응용 팁','직접 확인하기'][j]}</h2><p>${esc(d)}</p></section>`).join('')}${g.category==='제품 가이드'?btn('나의 화장대 열기',"go('me','shelf')",'primary full'):''}<div class="mag-next"><span>다음 매거진</span><button onclick="go('lab','guide-${(i+1)%labGuides.length}')">${labGuides[(i+1)%labGuides.length].title} →</button></div></article>`);return}

if(sub==='product-add'){shell(`${btn('← 나의 화장대',"go('me','shelf')",'outline')}<div class="product-form-title"><div class="eyebrow">ADD TO MY SHELF</div><h1>어떤 제품을 사용하시나요?</h1><p>제품 정보를 등록하면 나의 화장대에서 확인할 수 있습니다.</p></div><div class="upload-preview"><div class="upload-visual"><div class="cosmetic-bottle"></div></div><div><b>제품 사진</b><p>사진 첨부 기능은 공용 제품 DB 및 저장소 연결 후 제공됩니다.</p></div></div><div class="card"><div class="field"><label>브랜드명 (선택)</label><input id="productBrand" maxlength="70" placeholder="예: 라운드랩"></div><div class="field"><label>제품명</label><input id="productName" maxlength="90" placeholder="예: 독도 토너"></div><div class="field"><label>제품 카테고리</label><select id="productCat">${productCats.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>${btn('내 화장대에 등록','addProduct()','primary full')}</div><p class="tiny">현재 제품은 개인 기록으로 저장됩니다. 전체 사용자에게 공개되는 제품 등록·승인 기능은 아직 준비 중입니다.</p>`);return}
if(sub==='diary'){shell(`${btn('← 마이뷰티',"go('me')",'outline')}${section('피부 기록')}<p class="muted">매일의 피부 상태를 간단하게 기록해 보세요.</p><div class="card"><div class="field"><label>오늘 피부는 얼마나 편안했나요?</label><select id="comfort"><option value="5">5 · 매우 편안함</option><option value="4">4 · 편안함</option><option value="3">3 · 보통</option><option value="2">2 · 약간 불편함</option><option value="1">1 · 불편함</option></select></div><div class="field"><label>오늘의 메모 (선택)</label><textarea id="diaryNotes" maxlength="600" placeholder="오늘 피부에서 느낀 점을 기록해 보세요"></textarea></div>${btn('기록 저장','addDiary()','primary full')}</div>${state.diary.slice().reverse().map(d=>`<div class="card"><b>${esc(d.date)}</b><p>피부 편안함 ${d.comfort}/5</p><p class="muted">${esc(d.notes)}</p></div>`).join('')}`);return}
shell(`${section('마이뷰티')}${authPanel()}<div class="card"><div class="eyebrow">MY PROFILE</div><div class="field"><label>나의 피부 타입 (자가 선택)</label><select id="skinType" onchange="state.skin=this.value;save()">${[['Dry','건성'],['Oily','지성'],['Combination','복합성'],['Normal','중성'],['Not sure','잘 모르겠어요']].map(x=>`<option value="${x[0]}" ${state.skin===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>주요 피부 관리 목표</label><select id="skinConcern" onchange="state.concern=this.value;save()">${[['Hydration','보습'],['Simple routine','간단한 루틴'],['Oil balance','유수분 균형'],['Skin comfort','피부 편안함'],['Texture','피부 결 관리']].map(x=>`<option value="${x[0]}" ${state.concern===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><button class="my-menu" onclick="go('me','shelf')"><span class="my-menu-art">01</span><span><b>나의 화장대</b><small>등록 제품 ${state.products.length}개 · 아침 ${state.am.length}개 · 저녁 ${state.pm.length}개</small></span><strong>›</strong></button><button class="my-menu" onclick="go('me','diary')"><span class="my-menu-art">02</span><span><b>피부 기록</b><small>저장된 기록 ${state.diary.length}개</small></span><strong>›</strong></button><div class="card"><b>개인정보 및 데이터 관리</b><p class="muted">로그인한 계정의 개인 데이터는 Supabase에 저장됩니다. 커뮤니티 게시글은 아직 다른 회원에게 공개되지 않습니다.</p>${btn('내 데이터 내보내기','exportData()','outline full')}<div class="spacer"></div>${btn('데이터 가져오기','document.getElementById(&quot;importFile&quot;).click()','outline full')}<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"><div class="spacer"></div>${btn('내 데이터 전체 삭제','deleteData()','outline full')}</div>`)}
function addProduct(){let name=document.getElementById('productName').value.trim(),cat=document.getElementById('productCat').value;if(!name)return alert('Enter a product name.');if(state.products.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return alert('This product is already in your shelf.');const brand=document.getElementById('productBrand')?.value.trim()||'';state.products.push({name:brand?brand+' · '+name:name,cat,id:Date.now()});save();go('me','shelf')}function removeProduct(i){let p=state.products[i];if(!confirm('Remove this product?'))return;state.products.splice(i,1);state.am=state.am.filter(x=>x!==p.name);state.pm=state.pm.filter(x=>x!==p.name);save();render()}function addRoutine(i,period){let name=state.products[i].name;if(!state[period].includes(name))state[period].push(name);save();alert('Added to '+period.toUpperCase()+' routine.');render()}function addDiary(){const entry={date:today(),comfort:Number(document.getElementById('comfort').value),notes:document.getElementById('diaryNotes').value.trim()};state.diary=state.diary.filter(d=>d.date!==entry.date);state.diary.push(entry);save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='glowme-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{if(file.size>1048576)throw Error("File exceeds 1 MB");const raw=JSON.parse(await file.text());if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Invalid format");for(const key of ["products","am","pm","diary","posts","likes"]){if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw Error("Invalid "+key)}if(!confirm("Replace all local GLOWME data with this backup?"))return;state={...structuredClone(init),...Object.fromEntries(Object.keys(init).filter(k=>Object.hasOwn(raw,k)).map(k=>[k,raw[k]]))};save();go("today");alert("Backup imported successfully.")}catch(e){alert("Could not import backup: "+e.message)}}function deleteData(){if(confirm('Permanently delete all data stored by GLOWME on this browser?')){localStorage.removeItem(KEY);state=structuredClone(init);go('today')}}
const seed=[{id:'s1',tag:'스킨케어',title:'아침 스킨케어 루틴은 어떻게 구성하시나요?',body:'자주 사용하는 제품과 순서를 공유해 주세요.',author:'GLOWME'},{id:'s2',tag:'퍼스널컬러',title:'요즘 가장 자주 사용하는 립 컬러는?',body:'코랄·로즈·베리 중 어떤 색을 즐겨 사용하시나요?',author:'GLOWME'},{id:'s3',tag:'헤어',title:'다음에 도전하고 싶은 헤어스타일은?',body:'단발·레이어드·앞머리 등 자유롭게 이야기해 주세요.',author:'GLOWME'}];

function renderCommunity(){const posts=[...state.posts,...seed].filter(p=>communityFilter==='All'||communityFilter==='전체'||p.tag===communityFilter);if(sub==='write'){shell(`${btn('← 목록으로',"go('community')",'outline')}${section('새 글 작성')}<p class="muted">뷰티 경험과 사용 제품을 공유해 보세요. 현재는 이 기기에만 저장됩니다.</p><div class="card"><div class="field"><label>카테고리</label><select id="postTag">${communityCategories.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>제목</label><input id="postTitle" maxlength="100" placeholder="어떤 이야기를 나누고 싶으세요?"></div><div class="field"><label>내용</label><textarea id="postBody" maxlength="1000" placeholder="제품명과 사용 경험을 자세히 적어 주세요"></textarea></div><div class="field"><label>사진 첨부 (1MB 이하)</label><input id="postImage" type="file" accept="image/png,image/jpeg,image/webp"></div>${btn('게시글 저장','addPost()','primary full')}</div>`);return}
if(sub.startsWith('post-')){const id=sub.slice(5),p=[...state.posts,...seed].find(x=>x.id===id);if(!p){go('community');return}shell(`${btn('← 커뮤니티',"go('community')",'outline')}<article class="community-detail"><div class="eyebrow">${esc(p.tag)} · ${esc(p.author)}</div><h1>${esc(p.title)}</h1><p>${esc(p.body)}</p>${p.image?`<img class="community-photo" src="${p.image}" alt="게시글 사진">`:''}<div class="row"><button class="outline" onclick="toggleLike('${p.id}')">${state.likes.includes(p.id)?'♥ 좋아요 취소':'♡ 좋아요'}</button>${p.author==='나'?btn('삭제',`removePost('${p.id}')`,'outline'):''}</div></article>${section('댓글 '+(state.comments?.[p.id]||[]).length)}<div class="comment-list">${(state.comments?.[p.id]||[]).map(c=>`<div class="comment"><b>나</b><p>${esc(c)}</p></div>`).join('')||'<p class="muted">첫 댓글을 남겨 보세요.</p>'}</div><div class="comment-entry"><input id="comment-${p.id}" maxlength="400" placeholder="댓글을 입력하세요"><button class="secondary" onclick="addComment('${p.id}')">등록</button></div>`);return}
shell(`<div class="community-top"><div><div class="eyebrow">GLOWME SOCIAL</div><h1>뷰티 커뮤니티</h1><p>오늘의 뷰티 경험을 나눠 보세요.</p></div><button class="primary" onclick="go('community','write')">글쓰기 +</button></div><p class="tiny">현재는 내 기기에 저장되는 미리보기입니다. 다른 회원과 공유하려면 서버 연결이 필요합니다.</p><div class="choices">${communityCategories.map(x=>`<button class="choice ${communityFilter===x?'active':''}" onclick="communityFilter='${x}';render()">${x}</button>`).join('')}</div><div class="community-feed">${posts.map(p=>`<button class="feed-card" onclick="go('community','post-${p.id}')"><div class="feed-copy"><span class="eyebrow">${esc(p.tag)} · ${esc(p.author)}</span><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><span class="feed-meta">♡ ${state.likes.includes(p.id)?1:0}　 댓글 ${(state.comments?.[p.id]||[]).length}　 · 자세히 보기 →</span></div>${p.image?`<img src="${p.image}" alt="게시글 사진">`:'<div class="feed-art"></div>'}</button>`).join('')}</div>`)}
function addComment(id){const el=document.getElementById('comment-'+id),v=el?.value.trim();if(!v)return;state.comments=state.comments||{};(state.comments[id]=state.comments[id]||[]).push(v);save();render()}
async function addPost(){const title=document.getElementById('postTitle').value.trim(),body=document.getElementById('postBody').value.trim(),tag=document.getElementById('postTag').value;if(!title||!body)return alert('제목과 내용을 입력해 주세요.');const file=document.getElementById('postImage').files[0];if(file&&(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1024*1024))return alert('PNG·JPG·WEBP 파일을 1MB 이하로 선택해 주세요.');let image='';if(file){image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}state.posts.unshift({id:'p'+Date.now(),tag,title,body,image,author:'나'});try{save()}catch(e){state.posts.shift();return alert('기기 저장 공간이 부족합니다. 사진 크기를 줄여 주세요.')}render()}
function toggleLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}
function removePost(id){state.posts=state.posts.filter(x=>x.id!==id);save();render()}
