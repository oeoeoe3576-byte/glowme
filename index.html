function skinReport(r){return `<div class="visual-report"><div class="eyebrow">SKIN REPORT</div><h2>${esc(r.title)}</h2><div class="skin-editorial-photo"><span>SKIN CONDITION · SELF CHECK</span></div><div class="skin-focus-grid"><div><div class="skin-focus-image skin-texture"></div><b>피부 표면</b><small>각질과 결을 관찰</small></div><div><div class="skin-focus-image skin-moisture"></div><b>수분·유분</b><small>부위별 상태 비교</small></div></div><div class="visual-tips"><div><b>분석 근거</b><p>세안 직후·오후 유분·보습제 사용감·평소 상태에 대한 4가지 자가 응답을 비교한 결과입니다. 피지량이나 수분량을 기기로 측정한 결과가 아닙니다.</p></div><div><b>01 세안</b><p>세안 후 당김이 심하지 않은 순한 제품을 선택하세요.</p></div><div><b>02 보습</b><p>건조한 부위와 유분이 많은 부위의 사용감을 나눠 관찰하세요.</p></div><div><b>03 낮 루틴</b><p>보습 후 자외선 차단을 유지하세요.</p></div></div>${btn('내 화장대에서 제품 찾기',"go('me','product-pick')",'outline full')}</div>`}
function faceIllustration(r){const all=['계란형','둥근형','긴형','각진형','하트형','다이아몬드형'];return `<section class="beauty-face-report"><div class="eyebrow">MY FACE REPORT</div><h2>${esc(r.title)} · 나의 얼굴형</h2><div class="beauty-face-hero"><div class="face-photo"></div><div class="face-hero-caption"><span>FACE SHAPE EDIT</span><strong>얼굴의 윤곽과 비율을<br>함께 살펴보세요</strong></div></div><div class="beauty-shape-choices">${all.map(t=>`<div class="${t===r.title?'selected':''}"><div class="shape-outline ${t==='둥근형'?'round':t==='긴형'?'long':t==='각진형'?'square':t==='하트형'?'heart':t==='다이아몬드형'?'diamond':'oval'}"></div><small>${t}</small></div>`).join('')}</div><p class="beauty-note">사진은 스타일링 참고용 모델 이미지입니다. 실제 얼굴을 촬영·측정한 결과가 아닙니다.</p></section>`}
function renderAnalyze(){if(sub==='face'||sub==='color'||sub==='skin'){const face=sub==='face',skin=sub==='skin',qs=face?faceQs:skin?skinQs:colorQs,answers=face?faceAnswers:skin?skinAnswers:colorAnswers;if(step>=qs.length){const r=face?faceResult():skin?skinResult():colorResult();shell(`<div class="eyebrow">${face?'FACE ANALYSIS':skin?'SKIN ANALYSIS':'COLOR ANALYSIS'}</div><div class="result"><div class="eyebrow">나의 분석 결과 · ${esc(r.confidence)}</div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p></div>${face?faceIllustration(r)+faceThirdsUI()+faceStyleCards(r):skin?skinReport(r):visualColorReport(r)+makeupRecommendations(r)}<div class="notice">이 결과는 자가 응답을 기반으로 한 스타일 참고 자료이며, 사진·색채 측정이나 전문가의 대면 진단을 대신하지 않습니다.</div><div class="spacer"></div>${btn('결과 저장',`saveAnalysis('${sub}')`,'primary full')}<div class="spacer"></div>${btn('다시 분석하기',`restartAnalysis('${sub}')`,'outline full')}`);return}const q=qs[step];shell(`<div class="row"><span class="eyebrow">${face?'FACE SHAPE':skin?'SKIN TYPE':'PERSONAL COLOR'}</span><span class="muted">${step+1} / ${qs.length}</span></div><div class="progress" style="margin:16px 0 30px"><div style="width:${(step+1)/qs.length*100}%"></div></div><h1 class="analysis-question">${q[0]}</h1><p class="muted">${esc((face?faceHelp:skin?['세안 후 느낌을 선택하세요.','오후의 피부 상태를 떠올려 보세요.','보습제 사용감을 선택하세요.','가장 자주 느끼는 상태를 선택하세요.']:colorHelp)[step])}</p>${!face&&!skin?`<div class="swatch-compare">${colorSwatches[step].map((pair)=>pair.map((c,i)=>`<div class="swatch-sample"><div style="background:${c}"></div><small>${i===0?"A":"B"}</small></div>`).join("")).join("")}</div><p class="tiny">화면 색상은 참고용입니다. 실제 옷이나 천으로 비교해야 더 의미 있습니다.</p>`:""}<div class="answer-list">${q[1].map((a,i)=>`<button class="answer-option" onclick="answerAnalysis(${i})"><span>${esc(a)}</span><span>›</span></button>`).join('')}</div>${step?btn('← 이전 질문','step--;render()','outline'):''}`);return}shell(`${section('나를 알아가는 뷰티 분석')}<p class="muted">한 번의 질문으로 단정하지 않고, 여러 특징을 종합해 스타일링 방향을 제안합니다.</p><div class="analysis-entry" onclick="restartAnalysis('face')"><div class="analysis-index">01 / FACE</div><h3>얼굴형 세부 분석</h3><p>길이·너비·광대·턱선 등 7가지 특징을 종합해 유형과 복합 가능성을 살펴봅니다.</p><span class="entry-link">7문항 분석 시작 ↗</span></div><div class="analysis-entry" onclick="restartAnalysis('color')"><div class="analysis-index">02 / COLOR</div><h3>퍼스널컬러 탐색</h3><p>웜·쿨, 밝기, 선명도, 대비 등 9가지 비교로 4계절 방향을 탐색합니다.</p><span class="entry-link">9문항 분석 시작 ↗</span></div><div class="analysis-entry" onclick="restartAnalysis('skin')"><div class="analysis-index">03 / SKIN</div><h3>피부 타입 분석</h3><p>건성·지성·복합성·중성 경향을 4문항으로 체크하세요.</p><span class="entry-link">분석 시작 ↗</span></div>${state.face||state.color||state.skinAnalysis?section('저장된 분석 결과'):''}${state.face?`<div class="card">얼굴형 <b>${esc(state.face.title)}</b></div>`:''}${state.color?`<div class="card">퍼스널컬러 <b>${esc(state.color.title)}</b></div>`:''}`)}
function restartAnalysis(s){step=0;if(s==='face')faceAnswers={};else if(s==='skin')skinAnswers={};else colorAnswers={};go('analyze',s)}
function answerAnalysis(i){(sub==='face'?faceAnswers:sub==='skin'?skinAnswers:colorAnswers)[step]=i;step++;render()}
function saveAnalysis(s){if(s==='skin')state.skinAnalysis=skinResult();else state[s]=s==='face'?faceResult():colorResult();save();go('analyze')}

shell(`${section('마이뷰티')}${authPanel()}<div class="card"><div class="eyebrow">MY PROFILE</div><div class="field"><label>나의 피부 타입 (자가 선택)</label><select id="skinType" onchange="state.skin=this.value;save()">${[['Dry','건성'],['Oily','지성'],['Combination','복합성'],['Normal','중성'],['Not sure','잘 모르겠어요']].map(x=>`<option value="${x[0]}" ${state.skin===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>주요 피부 관리 목표</label><select id="skinConcern" onchange="state.concern=this.value;save()">${[['Hydration','보습'],['Simple routine','간단한 루틴'],['Oil balance','유수분 균형'],['Skin comfort','피부 편안함'],['Texture','피부 결 관리']].map(x=>`<option value="${x[0]}" ${state.concern===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><button class="my-menu" onclick="go('me','shelf')"><span class="my-menu-art">01</span><span><b>나의 화장대</b><small>등록 제품 ${state.products.length}개 · 아침 ${state.am.length}개 · 저녁 ${state.pm.length}개</small></span><strong>›</strong></button><button class="my-menu" onclick="go('me','diary')"><span class="my-menu-art">02</span><span><b>피부 기록</b><small>저장된 기록 ${state.diary.length}개</small></span><strong>›</strong></button><div class="card"><b>개인정보 및 데이터 관리</b><p class="muted">로그인한 계정의 개인 데이터는 Supabase에 저장됩니다. 커뮤니티 게시글은 아직 다른 회원에게 공개되지 않습니다.</p>${btn('내 데이터 내보내기','exportData()','outline full')}<div class="spacer"></div>${btn('데이터 가져오기','document.getElementById(&quot;importFile&quot;).click()','outline full')}<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"><div class="spacer"></div>${btn('내 데이터 전체 삭제','deleteData()','outline full')}</div>`)}
const curatedProducts=[{brand:'에스트라',name:'아토베리어365 크림',cat:'Moisturizer',id:'aestura-atobarrier365-cream',description:'보습 크림 · 사용 전 제품 표기를 확인하세요.'}];
function renderProductChoices(query=''){const el=document.getElementById('productChoices');if(!el)return;const list=curatedProducts.filter(p=>(p.brand+' '+p.name).toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()));el.innerHTML=list.map(p=>`<div class="curated-product"><div class="curated-art"><div class="curated-jar"></div></div><div class="curated-info"><div class="eyebrow">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><button class="primary" onclick="addCuratedProduct('${p.id}')">${state.products.some(x=>x.catalogId===p.id)?'이미 담은 제품':'내 화장대에 담기'}</button></div></div>`).join('')||'<p class="muted">검색 결과가 없습니다. 아래에서 제품을 직접 등록해 주세요.</p>'}
function addCuratedProduct(id){const p=curatedProducts.find(x=>x.id===id);if(!p)return;if(state.products.some(x=>x.catalogId===id||(x.name===p.brand+' · '+p.name)))return alert('이미 나의 화장대에 등록된 제품입니다.');state.products.push({name:p.brand+' · '+p.name,cat:p.cat,catalogId:p.id,id:Date.now()});save();go('me','shelf');alert('에스트라 아토베리어365 크림을 내 화장대에 추가했습니다. 제품 카드에서 아침·저녁 루틴에 등록할 수 있습니다.')}
function addProduct(){let name=document.getElementById('productName').value.trim(),cat=document.getElementById('productCat').value;if(!name)return alert('제품명을 입력해 주세요.');if(state.products.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return alert('이미 등록한 제품입니다.');const brand=document.getElementById('productBrand')?.value.trim()||'';state.products.push({name:brand?brand+' · '+name:name,cat,id:Date.now()});save();go('me','shelf')}function removeProduct(i){let p=state.products[i];if(!confirm('이 제품을 나의 화장대에서 삭제할까요?'))return;state.products.splice(i,1);state.am=state.am.filter(x=>x!==p.name);state.pm=state.pm.filter(x=>x!==p.name);save();render()}function addRoutine(i,period){let name=state.products[i].name;state[period]=state[period].includes(name)?state[period].filter(x=>x!==name):[...state[period],name];save();render()}function addDiary(){const entry={date:today(),comfort:Number(document.getElementById('comfort').value),notes:document.getElementById('diaryNotes').value.trim()};state.diary=state.diary.filter(d=>d.date!==entry.date);state.diary.push(entry);save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='glowme-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{if(file.size>1048576)throw Error("File exceeds 1 MB");const raw=JSON.parse(await file.text());if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Invalid format");for(const key of ["products","am","pm","diary","posts","likes"]){if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw Error("Invalid "+key)}if(!confirm("Replace all local GLOWME data with this backup?"))return;state={...structuredClone(init),...Object.fromEntries(Object.keys(init).filter(k=>Object.hasOwn(raw,k)).map(k=>[k,raw[k]]))};save();go("today");alert("Backup imported successfully.")}catch(e){alert("Could not import backup: "+e.message)}}function deleteData(){if(confirm('Permanently delete all data stored by GLOWME on this browser?')){localStorage.removeItem(KEY);state=structuredClone(init);go('today')}}
const seed=[{id:'s1',tag:'스킨케어',title:'아침 스킨케어 루틴은 어떻게 구성하시나요?',body:'자주 사용하는 제품과 순서를 공유해 주세요.',author:'GLOWME'},{id:'s2',tag:'퍼스널컬러',title:'요즘 가장 자주 사용하는 립 컬러는?',body:'코랄·로즈·베리 중 어떤 색을 즐겨 사용하시나요?',author:'GLOWME'},{id:'s3',tag:'헤어',title:'다음에 도전하고 싶은 헤어스타일은?',body:'단발·레이어드·앞머리 등 자유롭게 이야기해 주세요.',author:'GLOWME'}];
const communityCategories=['전체','스킨케어','퍼스널컬러','헤어','메이크업','제품 후기'];
function renderCommunity(){const posts=[...state.posts,...seed].filter(p=>communityFilter==='All'||communityFilter==='전체'||p.tag===communityFilter);if(sub==='write'){shell(`${btn('← 목록으로',"go('community')",'outline')}${section('새 글 작성')}<p class="muted">뷰티 경험과 사용 제품을 공유해 보세요. 현재는 이 기기에만 저장됩니다.</p><div class="card"><div class="field"><label>카테고리</label><select id="postTag">${communityCategories.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>제목</label><input id="postTitle" maxlength="100" placeholder="어떤 이야기를 나누고 싶으세요?"></div><div class="field"><label>내용</label><textarea id="postBody" maxlength="1000" placeholder="제품명과 사용 경험을 자세히 적어 주세요"></textarea></div><div class="field"><label>사진 첨부 (자동 압축)</label><input id="postImage" type="file" accept="image/*"></div><button id='postSubmit' class='primary full' onclick='addPost()'>게시글 저장</button></div>`);return}
if(sub.startsWith('post-')){const id=sub.slice(5),p=[...state.posts,...seed].find(x=>x.id===id);if(!p){go('community');return}shell(`${btn('← 커뮤니티',"go('community')",'outline')}<article class="community-detail"><div class="eyebrow">${esc(p.tag)} · ${esc(p.author)}</div><h1>${esc(p.title)}</h1><p>${esc(p.body)}</p>${p.image?`<img class="community-photo" src="${p.image}" alt="게시글 사진">`:''}<div class="row"><button class="outline" onclick="toggleLike('${p.id}')">${state.likes.includes(p.id)?'♥ 좋아요 취소':'♡ 좋아요'}</button>${p.author==='나'?btn('삭제',`removePost('${p.id}')`,'outline'):''}</div></article>${section('댓글 '+(state.comments?.[p.id]||[]).length)}<div class="comment-list">${(state.comments?.[p.id]||[]).map(c=>`<div class="comment"><b>나</b><p>${esc(c)}</p></div>`).join('')||'<p class="muted">첫 댓글을 남겨 보세요.</p>'}</div><div class="comment-entry"><input id="comment-${p.id}" maxlength="400" placeholder="댓글을 입력하세요"><button class="secondary" onclick="addComment('${p.id}')">등록</button></div>`);return}
shell(`<div class="community-top"><div><div class="eyebrow">GLOWME SOCIAL</div><h1>뷰티 커뮤니티</h1><p>오늘의 뷰티 경험을 나눠 보세요.</p></div><button class="primary" onclick="go('community','write')">글쓰기 +</button></div><p class="tiny">현재는 내 기기에 저장되는 미리보기입니다. 다른 회원과 공유하려면 서버 연결이 필요합니다.</p><div class="choices">${communityCategories.map(x=>`<button class="choice ${communityFilter===x?'active':''}" onclick="communityFilter='${x}';render()">${x}</button>`).join('')}</div><div class="community-feed">${posts.map(p=>`<button class="feed-card" onclick="go('community','post-${p.id}')"><div class="feed-copy"><span class="eyebrow">${esc(p.tag)} · ${esc(p.author)}</span><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><span class="feed-meta">♡ ${state.likes.includes(p.id)?1:0}　 댓글 ${(state.comments?.[p.id]||[]).length}　 · 자세히 보기 →</span></div>${p.image?`<img src="${p.image}" alt="게시글 사진">`:'<div class="feed-art"></div>'}</button>`).join('')}</div>`)}
function addComment(id){const el=document.getElementById('comment-'+id),v=el?.value.trim();if(!v)return;state.comments=state.comments||{};(state.comments[id]=state.comments[id]||[]).push(v);save();render()}
async function compressPostImage(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('이미지 파일을 선택해 주세요.');if(file.size>30*1024*1024)throw Error('30MB 이하 사진을 선택해 주세요.');let img;try{img=await createImageBitmap(file)}catch(e){const url=URL.createObjectURL(file);try{img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(Error('사진을 열 수 없습니다.'));el.src=url})}finally{URL.revokeObjectURL(url)}}const scale=Math.min(1,1280/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close?.();let quality=.8,data=canvas.toDataURL('image/jpeg',quality);while(data.length>900000&&quality>.4){quality-=.1;data=canvas.toDataURL('image/jpeg',quality)}if(data.length>1300000)throw Error('사진 압축에 실패했습니다. 다른 사진을 선택해 주세요.');return data}
async function addPost(){const title=document.getElementById('postTitle').value.trim(),body=document.getElementById('postBody').value.trim(),tag=document.getElementById('postTag').value;if(!title||!body)return alert('제목과 내용을 입력해 주세요.');const file=document.getElementById('postImage').files[0],submit=document.getElementById('postSubmit');if(submit){submit.disabled=true;submit.textContent='사진 처리 중…'}let image='';try{if(file)image=await compressPostImage(file)}catch(e){if(submit){submit.disabled=false;submit.textContent='게시글 저장'}return alert(e.message)}state.posts.unshift({id:'p'+Date.now(),tag,title,body,image,author:'나'});try{save()}catch(e){state.posts.shift();if(submit){submit.disabled=false;submit.textContent='게시글 저장'}return alert('저장 공간이 부족합니다. 사진을 줄여 다시 시도해 주세요.')}go('community')}
function toggleLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}
function removePost(id){state.posts=state.posts.filter(x=>x.id!==id);save();render()}
render();applyLanguage();initAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
