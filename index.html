<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0eb"><meta name="description" content="GLOWME: your personal beauty space for skin routines, face styling, color discovery and community."><link rel="manifest" href="manifest.webmanifest"><title>GLOWME — Your Beauty Space</title><style>
:root{--bg:#faf7f4;--card:#fff;--ink:#302a31;--muted:#8a7d83;--pink:#bb6d87;--soft:#f5e6eb;--line:#eee5e6;--green:#657c6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#fdfbf9;padding-bottom:100px;box-shadow:0 0 45px #38232b0c}header{padding:26px 23px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:23px;font-weight:bold}.tag{font-size:11px;letter-spacing:1.8px;color:var(--pink);text-transform:uppercase}.avatar{background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--pink)}main{padding:0 22px}.hero{background:linear-gradient(135deg,#f2dbe1,#faf0e8);padding:26px;border-radius:22px;position:relative;overflow:hidden;margin:12px 0 22px}.hero:after{content:'✦';font-size:120px;position:absolute;right:-12px;top:-16px;color:#ffffff70}.hero h1{font:normal 34px/1.08 Georgia,serif;max-width:265px;margin:10px 0}.hero p{max-width:270px;color:#79666e;line-height:1.55;font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--pink);font-weight:700}.section{margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}.section h2{font:normal 24px Georgia,serif;margin:0}.muted{color:var(--muted);font-size:12px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;margin:10px 0}.tile{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.tile .emoji{font-size:31px}.tile h3{margin:9px 0 4px;font:normal 20px Georgia,serif}.tile p{font-size:12px;color:var(--muted);line-height:1.4;margin:0}.primary{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 17px;font-weight:600}.secondary{background:var(--soft);color:#82485c;border:0;border-radius:12px;padding:12px 15px}.outline{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 13px;color:var(--ink)}.full{width:100%}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #e6dce0;border-radius:12px;background:white;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{padding:10px 12px;border:1px solid #e8dce1;border-radius:20px;background:white;color:#75676e;font-size:12px}.choice.active{background:var(--pink);color:white;border-color:var(--pink)}.result{background:linear-gradient(140deg,#f7e8ee,#fff5ed);border-radius:18px;padding:22px;margin:16px 0}.result h3{font:normal 29px Georgia,serif;margin:8px 0}.result p{font-size:13px;line-height:1.7}.listitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.grow{flex:1}.tiny{font-size:11px;color:var(--muted)}.pill{font-size:10px;background:var(--soft);color:#96566b;padding:6px 9px;border-radius:30px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdfbf2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:11px 3px calc(12px + env(safe-area-inset-bottom));z-index:20}.nav{border:0;background:none;color:#988a91;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px}.nav span{font-size:21px}.nav.active{color:var(--pink);font-weight:700}.hidden{display:none!important}.progress{height:8px;background:#f3e8eb;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--pink)}.post{margin:12px 0}.post h3{font-size:16px;margin:9px 0}.post p{font-size:13px;color:#766a70;line-height:1.55}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.notice{font-size:12px;background:#f7f0ed;padding:12px;border-radius:10px;color:#796b6e;line-height:1.5}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.swatches{display:flex;gap:5px;margin:14px 0}.swatches span{height:36px;flex:1;border-radius:7px}.spacer{height:8px}a{color:var(--pink)}
</style></head><body><div class="app"><header><div><div class="tag">Your personal beauty space</div><div class="brand">GLOWME</div></div><div class="avatar">✧</div></header><main id="main"></main><nav class="bottom" id="nav"></nav></div><script>
const KEY='glowme_mvp_v1';const init={skin:'Combination',concern:'Hydration',products:[],am:[],pm:[],logs:{},diary:[],face:null,color:null,posts:[],likes:[],saved:[]};let state;try{state={...init,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...init}};let tab='today',sub='',step=0,faceAnswers={},colorAnswers={},communityFilter='All';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const btn=(label,fn,cls='primary')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;const section=t=>`<div class="section"><h2>${t}</h2></div>`;const shell=(html)=>{document.getElementById('main').innerHTML=html;document.getElementById('nav').innerHTML=[['today','⌂','Today'],['analyze','◈','Analyze'],['lab','✧','Beauty Lab'],['community','♧','Community'],['me','◯','My Beauty']].map(([id,ico,label])=>`<button class="nav ${tab===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('')};function go(t,s=''){tab=t;sub=s;render();scrollTo(0,0)}function render(){({today:renderToday,analyze:renderAnalyze,lab:renderLab,community:renderCommunity,me:renderMe}[tab])()}
function renderToday(){let d=today(),done=state.logs[d]||[],steps=[...state.am.map(x=>'AM: '+x),...state.pm.map(x=>'PM: '+x)],pct=steps.length?Math.round(new Set(done.filter(x=>steps.includes(x))).size/steps.length*100):0;shell(`<div class="hero"><div class="eyebrow">A little glow, every day</div><h1>Beauty starts with you.</h1><p>Discover what suits you, simplify your routine, and feel good in your own skin.</p>${btn('Explore your beauty profile →',"go('analyze')")}</div>${section('Your daily ritual')}<div class="card"><div class="row"><b>Today’s routine</b><span class="pill">${pct}% complete</span></div><div class="progress" style="margin:14px 0"><div style="width:${pct}%"></div></div>${steps.length?steps.map((x,i)=>`<label class="listitem"><input type="checkbox" ${done.includes(x)?'checked':''} onchange="toggleLog('${encodeURIComponent(x)}',this.checked)"><span class="grow">${esc(x)}</span></label>`).join(''):`<p class="muted">Add your products in My Beauty to build your morning and evening routine.</p>${btn('Build my routine',"go('me','shelf')",'secondary')}`}</div>${section('Discover your beauty')}<div class="grid"><div class="card tile" onclick="go('analyze','face')"><span class="emoji">◡</span><div><h3>Face Shape</h3><p>Find flattering styling ideas</p></div></div><div class="card tile" onclick="go('analyze','color')"><span class="emoji">🎨</span><div><h3>Color Season</h3><p>Explore your color palette</p></div></div></div>${section('A beauty reminder')}<div class="notice">Your beauty profile is a style guide, not a medical diagnosis. There is no single right way to look.</div>`)}function toggleLog(x,on){x=decodeURIComponent(x);let d=today(),a=state.logs[d]||[];state.logs[d]=on?[...new Set([...a,x])]:a.filter(y=>y!==x);save();render()}
const faceQs=[['Which best describes your face length?',['Longer than width','About as long as wide','Not sure']],['How does your jawline look?',['Soft and rounded','Angular or defined','Narrow and pointed','Not sure']],['Where is your face widest?',['Cheekbones','Forehead','Jaw','Similar width','Not sure']]];const colorQs=[['Which jewelry do you tend to prefer?',['Gold','Silver','Both / not sure']],['Which color group feels more harmonious to you?',['Peach, coral, warm cream','Rose, lavender, cool blue','Not sure']],['Which overall colors do you enjoy wearing?',['Light and bright','Soft and muted','Deep and rich','Clear and high contrast']]];
function renderAnalyze(){if(sub==='face'||sub==='color'){let face=sub==='face',qs=face?faceQs:colorQs,answers=face?faceAnswers:colorAnswers,existing=face?state.face:state.color;if(step>=qs.length){let r=face?faceResult():colorResult();shell(`<div class="eyebrow">Your discovery</div><div class="result"><div class="eyebrow">${face?'Face styling':'Color exploration'}</div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p></div>${section('Ideas to try')}${r.tips.map(x=>`<div class="card">✦ &nbsp;${esc(x)}</div>`).join('')}<div class="notice">${face?'Face shapes are flexible styling descriptions, not objective measurements.':'Color preferences are not a professional personal color diagnosis; lighting and perception can change results.'}</div><div class="spacer"></div>${btn('Save my result',`saveAnalysis('${sub}')`,'primary full')}<div class="spacer"></div>${btn('Start again',`restartAnalysis('${sub}')`,'outline full')}`);return}let q=qs[step];shell(`<div class="row"><span class="eyebrow">${face?'Face Lab':'Color Lab'}</span><span class="muted">${step+1} / ${qs.length}</span></div><div class="progress" style="margin:16px 0 30px"><div style="width:${(step+1)/qs.length*100}%"></div></div><h1 style="font:normal 32px Georgia,serif">${q[0]}</h1><p class="muted">Choose the closest answer. You can always choose “Not sure”.</p><div style="margin:25px 0">${q[1].map((a,i)=>`<button class="outline full" style="text-align:left;margin:5px 0;padding:17px" onclick="answerAnalysis(${i})">${esc(a)} →</button>`).join('')}</div>${step?btn('← Previous','step--;render()','outline'):''}`);return}shell(`${section('Explore your beauty')}<p class="muted">Personalized inspiration without unrealistic beauty standards.</p><div class="card tile" onclick="restartAnalysis('face')"><span class="emoji">◡</span><div><h3>Face Shape Guide</h3><p>Explore proportions, hairstyle ideas, frames and makeup placement.</p><p class="eyebrow" style="margin-top:12px">${state.face?'View a new result →':'3 quick questions →'}</p></div></div><div class="card tile" onclick="restartAnalysis('color')"><span class="emoji">🎨</span><div><h3>Personal Color Explorer</h3><p>Discover a seasonal color direction through your preferences.</p><p class="eyebrow" style="margin-top:12px">3 quick questions →</p></div></div>${state.face||state.color?section('Saved discoveries'):''}${state.face?`<div class="card">Face: <b>${esc(state.face.title)}</b></div>`:''}${state.color?`<div class="card">Color: <b>${esc(state.color.title)}</b></div>`:''}`)}function restartAnalysis(s){step=0;if(s==='face')faceAnswers={};else colorAnswers={};go('analyze',s)}function answerAnalysis(i){(sub==='face'?faceAnswers:colorAnswers)[step]=i;step++;render()}function faceResult(){let a=faceAnswers;let title=a[0]===0?(a[1]===2?'Heart-inspired':'Oblong-inspired'):a[1]===1?'Angular-inspired':a[2]===0?'Diamond-inspired':'Soft oval / round-inspired';return{title,description:'Your answers suggest a few styling directions. Face shapes often overlap, so use these ideas as options rather than rules.',tips:title.includes('Oblong')?['Try side volume or layered cuts if you want more visual width.','Experiment with horizontal blush placement.','Explore frames with more lens depth.']:title.includes('Angular')?['Try soft layers or textured waves for contrast.','Experiment with rounded or upswept frames.','Blush can be placed softly across the cheeks.']:title.includes('Heart')?['Explore chin-length layers and curtain bangs.','Try frames with softer lower edges.','Experiment with blush near the center of the cheeks.']:['Try face-framing layers or different partings.','Explore frame shapes based on your personal style.','Try several blush placements to see what you enjoy.']}}function colorResult(){let a=colorAnswers;let cool=a[0]===1||a[1]===1;let bright=a[2]===0||a[2]===3;let title=cool?(bright?'Winter-inspired':'Summer-inspired'):(bright?'Spring-inspired':'Autumn-inspired');return{title,description:'This is a starting palette based on preferences, not a definitive assessment of your undertone.',tips:cool?['Try rose, mauve, blue-based pink and cool neutrals.','Compare shades in consistent daylight.','Keep the colors that make you feel confident.']:['Try peach, coral, warm beige and earthy tones.','Compare similar shades side by side.','Your favorite colors matter more than any label.']}}function saveAnalysis(s){state[s]=s==='face'?faceResult():colorResult();save();go('analyze')}
function renderLab(){shell(`${section('Beauty Lab')}<p class="muted">Practical styling guides to explore at your own pace.</p>${[{t:'Blush placement',icon:'🌸',desc:'Center of cheeks for a soft look; lifted placement for a different effect.'},{t:'Hair volume & balance',icon:'✂️',desc:'Side layers, fringe and parting can change the visual balance of a hairstyle.'},{t:'Color pairing',icon:'🎨',desc:'Try one statement shade with two softer neutrals.'},{t:'Gentle skincare basics',icon:'🧴',desc:'Cleanse gently, moisturize as needed, and use broad-spectrum sunscreen.'},{t:'New product journal',icon:'📔',desc:'Introduce products gradually and note your experience rather than assuming cause and effect.'}].map(x=>`<div class="card"><div style="font-size:28px">${x.icon}</div><h3>${x.t}</h3><p class="muted">${x.desc}</p></div>`).join('')}<div class="notice">Educational beauty content only. Persistent irritation or a concerning skin change deserves professional advice.</div>`)}
function renderMe(){if(sub==='shelf'){shell(`<div class="row">${section('My Shelf')}${btn('← Back',"go('me')",'outline')}</div><p class="muted">Keep track of what you own. Everything is stored in this browser on this device.</p><div class="card"><div class="field"><label>Product name</label><input id="productName" placeholder="e.g. Gentle Hydrating Cleanser" maxlength="90"></div><div class="field"><label>Category</label><select id="productCat"><option>Cleanser</option><option>Toner</option><option>Serum</option><option>Moisturizer</option><option>Sunscreen</option><option>Other</option></select></div>${btn('Add product','addProduct()','primary full')}</div>${state.products.length?state.products.map((p,i)=>`<div class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="tiny">${esc(p.cat)}</div></div>${btn('Remove',`removeProduct(${i})`,'outline')}</div><div class="choices" style="margin-top:12px">${btn('Add to AM',`addRoutine(${i},'am')`,'secondary')}${btn('Add to PM',`addRoutine(${i},'pm')`,'secondary')}</div></div>`).join(''):`<div class="empty">No products yet. Add your first product above.</div>`}`);return}if(sub==='diary'){shell(`${section('Skin Diary')}<p class="muted">A personal reflection journal, not a clinical assessment.</p><div class="card"><div class="field"><label>How comfortable does your skin feel today?</label><select id="comfort"><option value="5">5 — Very comfortable</option><option value="4">4 — Comfortable</option><option value="3">3 — Neutral</option><option value="2">2 — Some discomfort</option><option value="1">1 — Uncomfortable</option></select></div><div class="field"><label>Notes (optional)</label><textarea id="diaryNotes" maxlength="600" placeholder="What did you notice today?"></textarea></div>${btn('Save entry','addDiary()','primary full')}</div>${state.diary.slice().reverse().map(d=>`<div class="card"><div class="row"><b>${esc(d.date)}</b><span class="pill">Comfort ${d.comfort}/5</span></div><p class="muted">${esc(d.notes)}</p></div>`).join('')}`);return}shell(`${section('My Beauty')}<div class="card"><div class="eyebrow">Your profile</div><div class="field"><label>Skin type (self-reported)</label><select id="skinType" onchange="state.skin=this.value;save()">${['Dry','Oily','Combination','Normal','Not sure'].map(x=>`<option ${state.skin===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Main skincare goal</label><select id="skinConcern" onchange="state.concern=this.value;save()">${['Hydration','Simple routine','Oil balance','Skin comfort','Texture'].map(x=>`<option ${state.concern===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card tile" onclick="go('me','shelf')"><span class="emoji">🧴</span><div><h3>My Shelf</h3><p>${state.products.length} saved products · AM ${state.am.length} · PM ${state.pm.length}</p></div></div><div class="card tile" onclick="go('me','diary')"><span class="emoji">📔</span><div><h3>Skin Diary</h3><p>${state.diary.length} entries saved</p></div></div><div class="card"><b>Privacy & data</b><p class="muted">This demo stores data only in your browser's local storage. It has no account system, cloud sync, public profiles or server uploads.</p>${btn('Export my data','exportData()','outline full')}<div class="spacer"></div>${btn('Import my data','document.getElementById(&quot;importFile&quot;).click()','outline full')}<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"><div class="spacer"></div>${btn('Delete all my data','deleteData()','outline full')}</div>`)}function addProduct(){let name=document.getElementById('productName').value.trim(),cat=document.getElementById('productCat').value;if(!name)return alert('Enter a product name.');if(state.products.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return alert('This product is already in your shelf.');state.products.push({name,cat,id:Date.now()});save();render()}function removeProduct(i){let p=state.products[i];if(!confirm('Remove this product?'))return;state.products.splice(i,1);state.am=state.am.filter(x=>x!==p.name);state.pm=state.pm.filter(x=>x!==p.name);save();render()}function addRoutine(i,period){let name=state.products[i].name;if(!state[period].includes(name))state[period].push(name);save();alert('Added to '+period.toUpperCase()+' routine.');render()}function addDiary(){const entry={date:today(),comfort:Number(document.getElementById('comfort').value),notes:document.getElementById('diaryNotes').value.trim()};state.diary=state.diary.filter(d=>d.date!==entry.date);state.diary.push(entry);save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='glowme-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{if(file.size>1048576)throw Error("File exceeds 1 MB");const raw=JSON.parse(await file.text());if(!raw||typeof raw!=="object"||Array.isArray(raw))throw Error("Invalid format");for(const key of ["products","am","pm","diary","posts","likes"]){if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw Error("Invalid "+key)}if(!confirm("Replace all local GLOWME data with this backup?"))return;state={...structuredClone(init),...Object.fromEntries(Object.keys(init).filter(k=>Object.hasOwn(raw,k)).map(k=>[k,raw[k]]))};save();go("today");alert("Backup imported successfully.")}catch(e){alert("Could not import backup: "+e.message)}}function deleteData(){if(confirm('Permanently delete all data stored by GLOWME on this browser?')){localStorage.removeItem(KEY);state=structuredClone(init);go('today')}}
const seed=[{id:'s1',tag:'Skincare',title:'What is your favorite simple AM routine?',body:'Share the three steps you actually enjoy keeping up with.',author:'GLOWME Team'},{id:'s2',tag:'Personal Color',title:'Which lipstick shades do you reach for most?',body:'Coral, rose, berry or something else? Tell us your favorites.',author:'GLOWME Team'},{id:'s3',tag:'Face Styling',title:'What hairstyle would you like to try next?',body:'Short bob, long layers or curtain bangs? Inspiration is welcome.',author:'GLOWME Team'}];function renderCommunity(){let posts=[...state.posts,...seed].filter(p=>communityFilter==='All'||p.tag===communityFilter);shell(`${section('Beauty Community')}<p class="muted">A local preview of the future GLOWME community. Your posts are not public or shared with other people.</p><div class="choices">${['All','Skincare','Personal Color','Face Styling','Makeup'].map(x=>`<button class="choice ${communityFilter===x?'active':''}" onclick="communityFilter='${x}';render()">${x}</button>`).join('')}</div><div class="card"><b>Share a beauty thought</b><div class="field"><label>Category</label><select id="postTag">${['Skincare','Personal Color','Face Styling','Makeup'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="postTitle" maxlength="100" placeholder="What would you like to discuss?"></div><div class="field"><label>Post</label><textarea id="postBody" maxlength="1000" placeholder="Share a tip or ask a question..."></textarea></div>${btn('Save draft on this device','addPost()','primary full')}</div>${posts.map(p=>`<div class="card post"><div class="row"><span class="pill">${esc(p.tag)}</span><span class="tiny">${esc(p.author)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="row"><button class="outline" onclick="toggleLike('${p.id}')">${state.likes.includes(p.id)?'♥ Liked':'♡ Like'}</button>${p.author==='You'?btn('Delete',`removePost('${p.id}')`,'outline'):''}</div></div>`).join('')}`)}function addPost(){let title=document.getElementById('postTitle').value.trim(),body=document.getElementById('postBody').value.trim(),tag=document.getElementById('postTag').value;if(!title||!body)return alert('Add a title and a post.');state.posts.unshift({id:'p'+Date.now(),tag,title,body,author:'You'});save();render()}function toggleLike(id){state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}function removePost(id){state.posts=state.posts.filter(x=>x.id!==id);save();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
